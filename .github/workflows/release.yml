name: Release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Fetch LGPL ffmpeg sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=${{ contains(matrix.args, 'x86_64') && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
          mkdir -p src-tauri/binaries && cd src-tauri/binaries
          gh release download ffmpeg-7.1.1-1 -R ${{ github.repository }} -p "ffmpeg-$T" -p "ffmpeg-$T.sha256"
          shasum -a 256 -c "ffmpeg-$T.sha256" && chmod +x "ffmpeg-$T"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ScreenLoop ${{ github.ref_name }}"
          releaseDraft: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
