[package]
name = "screenloop-desktop"
version = "0.1.17"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "screenloop_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7.20", features = ["io"] }
tokio = { version = "1.53.2", features = ["fs"] }
reqwest = { version = "0.13.5", features = ["stream", "rustls"] }
tauri-plugin-updater = "2.13.3"
tauri-plugin-process = "2.4.0"
xcap = "0.9.8"
image = "0.25.10"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-single-instance = "2.5.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
cpal = "0.18.2"
aes-gcm = "0.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
